<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAS Archive Search</title>
<style>
:root{color-scheme:light;--ink:#172d32;--accent:#14665f}*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:var(--ink);font:16px system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:48px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}p{line-height:1.5}.muted{color:#637276;font-size:14px}form{margin:30px 0 20px}input,select,button{font:inherit;border:1px solid #becbc8;border-radius:7px;padding:12px;background:white;color:var(--ink)}.bar{display:flex;gap:8px}input{flex:1;min-width:0}button{cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}.filters{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}label{font-size:13px}label select{margin-left:6px;padding:7px}article{background:white;border:1px solid #dce2de;border-radius:10px;padding:20px;margin:12px 0}h2{font-size:18px;margin:0 0 8px;overflow-wrap:anywhere}.path{font:12px ui-monospace,monospace;overflow-wrap:anywhere;color:#526868}.excerpt{white-space:pre-wrap;line-height:1.5;font-size:14px;max-height:150px;overflow:auto}.actions{display:flex;gap:12px;align-items:center;margin-top:14px}.actions button,.actions a{font-size:13px}.actions a{color:var(--accent)}dialog{width:min(900px,95vw);border:1px solid #becbc8;border-radius:10px;padding:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;max-height:65vh;overflow:auto}#status{max-width:360px;text-align:right}#message{white-space:pre-wrap}.badge{font-size:11px;border-radius:4px;padding:3px 6px;background:#edf3f0;margin-left:10px}@media(max-width:600px){header{display:block}#status{text-align:left}.bar{flex-wrap:wrap}main{padding:24px 16px}}
</style>
<main><header><div><div class="eyebrow">Your files · Your NAS</div><h1>Archive Search</h1><p class="muted">Documents, pictures, music and videos in one place.</p></div><div id="status" class="muted">Loading index status…</div></header>
<form id="form"><div class="bar"><input id="q" aria-label="Search archive" placeholder="A filename, phrase, artist or subject…" required autofocus><button class="primary">Search</button></div><div class="filters"><label>Type<select id="category"><option value="documents">Documents</option><option value="all">All files</option><option value="pictures">Pictures</option><option value="music">Music</option><option value="videos">Videos</option><option value="other">Other files</option></select></label><label>Share<select id="share"><option>all</option><option>Documents</option><option>Pictures</option><option>Music</option><option>Videos</option></select></label><label>Search<select id="mode"><option value="keyword">Words & filenames</option><option value="hybrid">Words + meaning</option><option value="semantic">Meaning</option></select></label></div></form>
<p id="message" class="muted">Search the NAS copy. Laptop changes appear after backup and indexing.</p><section id="results" aria-live="polite"></section><button id="more" hidden>Next page</button><dialog id="preview"><button id="close">Close</button><h2 id="ptitle"></h2><pre id="ptext"></pre><button id="nexttext" hidden>Read next section</button></dialog></main>
<script>
const $=id=>document.getElementById(id);let offset=0,current=null,seq=0,nextOffset=null,currentId=null;
function node(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
async function status(){try{const s=await(await fetch('/api/status')).json();const pending=s.by_state.find(x=>x.state==='pending')?.files||0;const j=s.jobs.inventory;$('status').textContent=`${s.files.toLocaleString()} files · ${pending.toLocaleString()} awaiting extraction\n${s.semantic_vectors.toLocaleString()} document vectors${j?.finished?' · Last scan '+new Date(j.finished*1000).toLocaleString():''}`;}catch{$('status').textContent='Index status unavailable'}}
async function preview(id,off=0){const r=await fetch('/api/read/'+id+'?offset='+off);if(!r.ok)return;const d=await r.json();currentId=id;nextOffset=d.next_offset;$('ptitle').textContent=d.name;$('ptext').textContent=(off?'':d.metadata+'\n\n')+d.text;$('nexttext').hidden=nextOffset===null;if(!$('preview').open)$('preview').showModal()}
async function search(){const n=++seq;$('message').textContent='Searching…';try{const params=new URLSearchParams({...current,offset,limit:20});const r=await fetch('/api/search?'+params);const d=await r.json();if(n!==seq)return;if(!r.ok)throw Error(d.detail||'Search failed');$('results').replaceChildren();for(const f of d.results){const a=node('article');const h=node('h2',f.name);h.append(node('span',f.state,'badge'));a.append(h,node('div',f.unc_path,'path'),node('p',f.excerpt||f.metadata||'Filename and path match','excerpt'));const actions=node('div','','actions');const b=node('button','Preview');b.onclick=()=>preview(f.id);const copy=node('button','Copy SMB path');copy.onclick=async()=>{try{await navigator.clipboard.writeText(f.unc_path);copy.textContent='Copied'}catch{window.prompt('Copy this path into File Explorer',f.unc_path)}};const down=node('a','Download copy');down.href='/api/download/'+f.id;actions.append(b,copy,down);a.append(actions);$('results').append(a)}$('message').textContent=`${d.total.toLocaleString()} matches · ${d.elapsed_ms} ms${d.warning?'\n'+d.warning:''}`;$('more').hidden=offset+20>=d.total||!d.results.length;}catch(e){$('message').textContent=e.message}}
$('form').onsubmit=e=>{e.preventDefault();offset=0;current={q:$('q').value,category:$('category').value,share:$('share').value,mode:$('mode').value};search()};$('more').onclick=()=>{offset+=20;search()};$('close').onclick=()=>$('preview').close();$('nexttext').onclick=()=>preview(currentId,nextOffset);status();setInterval(status,30000);
</script></html>
