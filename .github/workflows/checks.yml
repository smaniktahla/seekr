name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s . -p 'test_*.py' -v
      - run: python -m compileall -q core.py extract.py indexer.py worker.py server.py start.py mcp_proxy.py settings.py service.py docmost.py locking.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/build-windows.ps1
